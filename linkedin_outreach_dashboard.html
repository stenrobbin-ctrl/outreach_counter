<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Outreach Counter</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
    }

    header {
      max-width: 900px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    header h1 {
      font-size: 1.4rem;
      color: #e8eaf0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    #sync-status {
      font-size: 0.75rem;
      color: #9aa0b4;
      background: #1c1f2e;
      border-radius: 20px;
      padding: 0.3rem 0.75rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    .subtitle {
      max-width: 900px;
      margin: 0 auto 1.5rem;
      font-size: 0.8rem;
      color: #5a607a;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 380px) {
      .grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    }

    .card {
      background: #1c1f2e;
      border-radius: 14px;
      padding: 1.1rem 0.9rem 1rem;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      position: relative;
      transition: box-shadow 0.2s;
      border: 1px solid #252840;
    }

    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 14px 14px 0 0;
      background: var(--accent, #4f8ef7);
    }

    .stage-num {
      font-size: 0.62rem;
      font-weight: 700;
      color: #444a66;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card h2 {
      font-size: 0.78rem;
      color: #9aa0b4;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1.3;
    }

    .count {
      font-size: 2.6rem;
      font-weight: 800;
      color: #e8eaf0;
      line-height: 1;
      margin: 0.2rem 0;
    }

    .last-click {
      font-size: 0.65rem;
      color: #444a66;
      min-height: 0.9em;
    }

    button.plus-btn {
      margin-top: 0.2rem;
      background: var(--accent, #4f8ef7);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.45rem 1.1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      width: 100%;
    }

    button.plus-btn:hover { filter: brightness(1.2); }
    button.plus-btn:active { transform: scale(0.96); }
    button.plus-btn:disabled { background: #252840; color: #444a66; cursor: not-allowed; }

    .footer-actions {
      max-width: 900px;
      margin: 1.5rem auto 0;
      display: flex;
      justify-content: center;
    }

    .reset-btn {
      background: transparent;
      color: #5a607a;
      border: 1px solid #2a2f45;
      border-radius: 8px;
      padding: 0.45rem 1.2rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .reset-btn:hover { color: #e05555; border-color: #e05555; }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(79,142,247,0.4); }
      70%  { box-shadow: 0 0 0 10px rgba(79,142,247,0); }
      100% { box-shadow: 0 0 0 0 rgba(79,142,247,0); }
    }
    .card.pulse { animation: pulse-ring 0.5s ease-out; }
  </style>
</head>
<body>

<header>
  <h1>📊 LinkedIn Outreach</h1>
  <div id="sync-status">⏳ Verbinde…</div>
</header>
<p class="subtitle">Klicke +1 sobald du die Aktion ausgeführt hast. Sync läuft automatisch auf allen Geräten.</p>

<div class="grid" id="card-grid"></div>

<div class="footer-actions">
  <button class="reset-btn" onclick="resetAll()">🔄 Alle Zähler zurücksetzen</button>
</div>

<script>
  // ── Konfiguration ──────────────────────────────────────────────
  const SUPABASE_URL  = "https://wvfooydrjkcoamohylch.supabase.co";   // ← Project URL eintragen
  const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2Zm9veWRyamtjb2Ftb2h5bGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMjQxMjMsImV4cCI6MjA5NTgwMDEyM30.vn-lcQrbHbtC_FhdicCrHn_pQyzzwTqK9CjGS6uyFQ0";               // ← anon public key eintragen
  const TABLE         = "counter_events";

  const STAGES = [
    { key: "kontaktanfrage",    label: "Kontakt­anfrage",    accent: "#4f8ef7" },
    { key: "vernetzt",          label: "Vernetzt",           accent: "#5b8dee" },
    { key: "dm1",               label: "DM 1",               accent: "#7c6ff7" },
    { key: "pitch",             label: "Pitch",              accent: "#a259f7" },
    { key: "follow_up",         label: "Follow-up",          accent: "#f7925a" },
    { key: "einwandbehandlung", label: "Einwand­behandlung", accent: "#f75a5a" },
    { key: "positive_antwort",  label: "Positive Antwort",   accent: "#4fc97e" },
    { key: "erstgespraech",     label: "Erst­gespräch",      accent: "#27ae60" },
  ];

  // ── Supabase initialisieren ─────────────────────────────────────
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ── State ───────────────────────────────────────────────────────
  const state = {};
  STAGES.forEach(s => state[s.key] = { count: 0, lastClick: null });

  // ── UI ──────────────────────────────────────────────────────────
  function renderCards() {
    document.getElementById("card-grid").innerHTML = STAGES.map((s, i) => `
      <div class="card" id="card-${s.key}" style="--accent: ${s.accent}">
        <span class="stage-num">Stage ${i + 1}</span>
        <h2>${s.label}</h2>
        <div class="count" id="count-${s.key}">0</div>
        <div class="last-click" id="last-${s.key}"></div>
        <button class="plus-btn" id="btn-${s.key}" onclick="handleClick('${s.key}')">+1</button>
      </div>
    `).join("");
  }

  function updateUI(key) {
    const countEl = document.getElementById(`count-${key}`);
    const lastEl  = document.getElementById(`last-${key}`);
    if (!countEl) return;
    countEl.textContent = state[key].count;
    lastEl.textContent  = state[key].lastClick
      ? `${new Date(state[key].lastClick).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} Uhr`
      : "";
  }

  function pulseCard(key) {
    const card = document.getElementById(`card-${key}`);
    if (!card) return;
    card.classList.remove("pulse");
    void card.offsetWidth;
    card.classList.add("pulse");
  }

  function setStatus(msg) {
    document.getElementById("sync-status").textContent = msg;
  }

  // ── Records laden ───────────────────────────────────────────────
  async function loadCounts() {
    setStatus("⏳ Lade Daten…");
    const { data, error } = await db.from(TABLE).select("*").order("created_at");
    if (error) { console.error(error); setStatus("🔴 Verbindungsfehler"); return; }

    STAGES.forEach(s => state[s.key] = { count: 0, lastClick: null });
    data.forEach(r => {
      if (state[r.stage] !== undefined) {
        state[r.stage].count     += (r.delta || 1);
        state[r.stage].lastClick  = r.created_at;
      }
    });
    STAGES.forEach(s => updateUI(s.key));
    setStatus("🟢 Synchronisiert");
  }

  // ── Klick → Supabase Insert ─────────────────────────────────────
  async function handleClick(stageKey) {
    const btn = document.getElementById(`btn-${stageKey}`);
    if (btn) btn.disabled = true;
    const { error } = await db.from(TABLE).insert({
      stage:  stageKey,
      delta:  1,
      source: /iPhone|iPad|iPod/.test(navigator.userAgent) ? "ios" : "mac",
    });
    if (error) {
      console.error(error);
      setStatus("🔴 Speichern fehlgeschlagen");
      if (btn) btn.disabled = false;
    }
    // UI kommt über Realtime-Channel ↓
  }

  // ── Realtime-Sync ────────────────────────────────────────────────
  function subscribeRealtime() {
    db.channel("counter_events_channel")
      .on("postgres_changes",
        { event: "INSERT", schema: "public", table: TABLE },
        (payload) => {
          const r = payload.new;
          if (state[r.stage] !== undefined) {
            state[r.stage].count     += (r.delta || 1);
            state[r.stage].lastClick  = r.created_at;
            updateUI(r.stage);
            pulseCard(r.stage);
            setStatus("🟢 Synchronisiert");
            const btn = document.getElementById(`btn-${r.stage}`);
            if (btn) btn.disabled = false;
          }
        }
      )
      .on("postgres_changes",
        { event: "DELETE", schema: "public", table: TABLE },
        () => loadCounts()
      )
      .subscribe();
  }

  // ── Reset ────────────────────────────────────────────────────────
  async function resetAll() {
    if (!confirm("Alle Zähler wirklich auf 0 zurücksetzen?\nDas löscht alle gespeicherten Events permanent.")) return;
    setStatus("⏳ Lösche…");
    const { error } = await db.from(TABLE).delete().neq("id", 0);
    if (error) { console.error(error); setStatus("🔴 Reset fehlgeschlagen"); return; }
    setStatus("🟢 Zurückgesetzt");
  }

  // ── Start ────────────────────────────────────────────────────────
  (async () => {
    renderCards();
    await loadCounts();
    subscribeRealtime();
  })();
</script>
</body>
</html>
