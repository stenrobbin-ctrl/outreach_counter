<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Outreach</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117; min-height: 100vh;
      padding: 1.5rem 1rem 4rem; color: #e8eaf0;
    }
    header {
      max-width: 1300px; margin: 0 auto 1.5rem;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
    }
    header h1 { font-size: 1.4rem; color: #e8eaf0; }
    .header-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    .pill {
      font-size: 0.75rem; color: #9aa0b4; background: #1c1f2e;
      border-radius: 20px; padding: 0.3rem 0.75rem;
      cursor: pointer; transition: color 0.15s; border: none;
    }
    .pill:hover { color: #4f8ef7; }
    #sync-status {
      font-size: 0.75rem; color: #9aa0b4; background: #1c1f2e;
      border-radius: 20px; padding: 0.3rem 0.75rem;
    }
    .tabs {
      max-width: 1300px; margin: 0 auto 2rem;
      display: flex; gap: 0.5rem; border-bottom: 1px solid #252840; padding-bottom: 0.75rem;
    }
    .tab-btn {
      background: none; border: none; color: #5a607a;
      font-size: 0.9rem; font-weight: 600; padding: 0.4rem 1rem;
      cursor: pointer; border-radius: 8px; transition: background 0.15s, color 0.15s;
    }
    .tab-btn.active { background: #1c1f2e; color: #e8eaf0; }
    .tab-btn:hover:not(.active) { color: #9aa0b4; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .counter-layout {
      max-width: 1300px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 280px; gap: 1.5rem; align-items: start;
    }
    @media (max-width: 900px) { .counter-layout { grid-template-columns: 1fr; } }
    .counter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    @media (max-width: 500px) { .counter-grid { grid-template-columns: 1fr; } }
    .card {
      background: #1c1f2e; border-radius: 14px; padding: 1.1rem 0.9rem 1rem;
      text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.35);
      display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
      position: relative; border: 1px solid #252840;
    }
    .card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      border-radius: 14px 14px 0 0; background: var(--accent, #4f8ef7);
    }
    .stage-num { font-size: 0.62rem; font-weight: 700; color: #444a66; letter-spacing: 0.08em; text-transform: uppercase; }
    .card h2 { font-size: 0.78rem; color: #9aa0b4; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .count { font-size: 2.6rem; font-weight: 800; color: #e8eaf0; line-height: 1; margin: 0.2rem 0; }
    .last-click { font-size: 0.65rem; color: #444a66; min-height: 0.9em; }
    .btn-row { display: flex; gap: 0.4rem; width: 100%; margin-top: 0.2rem; }
    .minus-btn {
      background: #252840; color: #9aa0b4; border: none; border-radius: 8px;
      padding: 0.45rem 0.7rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; flex-shrink: 0;
      transition: background 0.15s;
    }
    .minus-btn:hover { background: #c0392b22; color: #e05555; }
    .minus-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .plus-btn {
      background: var(--accent, #4f8ef7); color: #fff; border: none; border-radius: 8px;
      padding: 0.45rem 0; font-size: 1rem; font-weight: 600; cursor: pointer; flex: 1;
      transition: filter 0.15s;
    }
    .plus-btn:hover { filter: brightness(1.2); }
    .plus5-btn {
      background: transparent; color: var(--accent, #4f8ef7);
      border: 2px solid var(--accent, #4f8ef7); border-radius: 8px;
      padding: 0.45rem 0.6rem; font-size: 0.85rem; font-weight: 700; cursor: pointer; flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .plus5-btn:hover { background: var(--accent, #4f8ef7); color: #fff; }
    .sidebar {
      background: #1c1f2e; border-radius: 14px; padding: 1.25rem;
      border: 1px solid #252840; position: sticky; top: 1.5rem;
    }
    .sidebar h3 { font-size: 0.8rem; color: #5a607a; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
    .stat-row {
      display: flex; justify-content: space-between; padding: 0.5rem 0;
      border-bottom: 1px solid #252840; font-size: 0.82rem;
    }
    .stat-row:last-of-type { border-bottom: none; }
    .stat-label { color: #9aa0b4; }
    .stat-accent { font-weight: 700; }
    .conv-row {
      display: flex; justify-content: space-between; font-size: 0.78rem;
      padding: 0.35rem 0; border-bottom: 1px solid #1a1d2e; color: #9aa0b4;
    }
    .conv-row span:last-child { color: #4fc97e; font-weight: 700; }
    .footer-actions { max-width: 1300px; margin: 1.5rem auto 0; display: flex; justify-content: center; }
    .reset-btn {
      background: transparent; color: #5a607a; border: 1px solid #2a2f45; border-radius: 8px;
      padding: 0.45rem 1.2rem; font-size: 0.82rem; font-weight: 600; cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .reset-btn:hover { color: #e05555; border-color: #e05555; }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(79,142,247,0.4); }
      70%  { box-shadow: 0 0 0 10px rgba(79,142,247,0); }
      100% { box-shadow: 0 0 0 0 rgba(79,142,247,0); }
    }
    .card.pulse { animation: pulse-ring 0.5s ease-out; }
    .messages-wrap { max-width: 1300px; margin: 0 auto; }
    .kampagne-block { margin-bottom: 3rem; }
    .kampagne-title {
      font-size: 0.72rem; color: #5a607a; text-transform: uppercase; letter-spacing: 0.12em;
      margin-bottom: 1.25rem; padding-bottom: 0.5rem; border-bottom: 1px solid #252840;
    }
    .stage-block { margin-bottom: 2rem; }
    .stage-title {
      font-size: 1.36rem; font-weight: 800; color: #d4d8e5;
      margin-bottom: 1rem; display: flex; align-items: center; gap: 0.65rem;
    }
    .stage-title-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--stage-accent, #4f8ef7); display: inline-block; flex-shrink: 0;
    }
    .ab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 700px) { .ab-grid { grid-template-columns: 1fr; } }
    .msg-card {
      background: #1c1f2e; border-radius: 14px; padding: 1.25rem;
      border: 1px solid #252840; display: flex; flex-direction: column; gap: 0.75rem;
      position: relative;
    }
    .msg-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      border-radius: 14px 14px 0 0;
    }
    .msg-card.variant-a::before { background: #4f8ef7; }
    .msg-card.variant-b::before { background: #a259f7; }
    .msg-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    .variant-badge {
      font-size: 0.65rem; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 0.2rem 0.6rem; border-radius: 20px;
    }
    .msg-card.variant-a .variant-badge { background: #4f8ef722; color: #4f8ef7; }
    .msg-card.variant-b .variant-badge { background: #a259f722; color: #a259f7; }
    .use-count { font-size: 0.72rem; color: #444a66; }
    .fokus-tag { font-size: 0.7rem; color: #5a607a; font-style: italic; }
    .msg-text {
      font-size: 0.85rem; color: #9aa0b4; line-height: 1.6;
      background: #0f1117; border-radius: 8px; padding: 0.85rem;
      white-space: pre-wrap; flex: 1;
    }
    .msg-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .copy-btn {
      background: #4f8ef7; color: #fff; border: none; border-radius: 8px;
      padding: 0.45rem 0.9rem; font-size: 0.82rem; font-weight: 600; cursor: pointer;
      transition: filter 0.15s; flex: 1; min-width: 110px;
    }
    .msg-card.variant-b .copy-btn { background: #a259f7; }
    .copy-btn:hover { filter: brightness(1.15); }
    .copy-btn.copied { background: #27ae60 !important; }
    .msg-track-row {
      display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: center;
    }
    .msg-track-btn {
      border: none; border-radius: 8px; cursor: pointer;
      font-weight: 700; font-size: 0.82rem; padding: 0.48rem 0.8rem;
      transition: transform 0.12s, filter 0.15s;
    }
    .msg-track-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .msg-track-btn.minus { background: #252840; color: #d87b7b; min-width: 58px; }
    .msg-track-btn.plus1 { background: #22324f; color: #7ab1ff; min-width: 58px; }
    .msg-track-btn.plus5 { background: transparent; border: 2px solid #4fc97e; color: #4fc97e; min-width: 58px; }
    .msg-track-hint { font-size: 0.72rem; color: #5a607a; margin-left: auto; }
    .stats-wrap { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 2.5rem; }
    .stats-kampagne-title {
      font-size: 0.72rem; color: #5a607a; text-transform: uppercase; letter-spacing: 0.12em;
      margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #252840;
    }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 800px) { .stats-grid { grid-template-columns: 1fr; } }
    .stats-card { background: #1c1f2e; border-radius: 14px; padding: 1.25rem; border: 1px solid #252840; }
    .stats-card h3 { font-size: 0.78rem; color: #5a607a; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
    .ab-stat-row { display: flex; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #1a1d2e; gap: 0.5rem; }
    .ab-stat-row:last-child { border-bottom: none; }
    .ab-stat-label { font-size: 0.78rem; color: #9aa0b4; min-width: 140px; }
    .ab-bar-wrap { display: flex; gap: 0.3rem; align-items: center; flex: 1; }
    .ab-bar { height: 6px; border-radius: 3px; min-width: 4px; transition: width 0.4s; }
    .bar-a { background: #4f8ef7; }
    .bar-b { background: #a259f7; }
    .ab-counts { display: flex; gap: 0.4rem; font-size: 0.72rem; }
    .ab-count-a { color: #4f8ef7; font-weight: 700; }
    .ab-count-b { color: #a259f7; font-weight: 700; }
    .ab-empty { font-size: 0.78rem; color: #444a66; font-style: italic; }
  </style>
</head>
<body>

<header>
  <h1>📊 LinkedIn Outreach</h1>
  <div class="header-actions">
    <button class="pill" onclick="exportJSON()">⬇ JSON Export</button>
    <button class="pill" onclick="reloadMessages()">🔄 Sync Notion</button>
    <div id="sync-status">⏳ Verbinde…</div>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('counter',this)">🎯 Counter</button>
  <button class="tab-btn" onclick="switchTab('messages',this)">💬 Nachrichten</button>
  <button class="tab-btn" onclick="switchTab('stats',this)">📈 A/B Stats</button>
</div>

<div id="tab-counter" class="tab-content active">
  <div class="counter-layout">
    <div class="counter-grid" id="card-grid"></div>
    <div class="sidebar">
      <h3>📈 Auswertung</h3>
      <div id="stats-total"></div>
      <div style="margin-top:1rem">
        <h3>🔄 Conversions</h3>
        <div id="stats-conv" style="margin-top:0.75rem"></div>
      </div>
    </div>
  </div>
  <div class="footer-actions">
    <button class="reset-btn" onclick="resetAll()">🔄 Alle Zähler zurücksetzen</button>
  </div>
</div>

<div id="tab-messages" class="tab-content">
  <div class="messages-wrap" id="messages-wrap">
    <div style="color:#5a607a;text-align:center;padding:3rem">⏳ Lade Nachrichten aus Notion…</div>
  </div>
</div>

<div id="tab-stats" class="tab-content">
  <div class="stats-wrap" id="stats-wrap">
    <div style="color:#5a607a;text-align:center;padding:3rem">⏳ Lade Statistiken…</div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const SUPABASE_URL = "https://wvfooydrjkcoamohylch.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2Zm9veWRyamtjb2Ftb2h5bGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMjQxMjMsImV4cCI6MjA5NTgwMDEyM30.vn-lcQrbHbtC_FhdicCrHn_pQyzzwTqK9CjGS6uyFQ0";
const NOTION_PROXY = "https://linkedin-dashboard.stenrobbin.workers.dev/";
const NOTION_DB_ID = "99f511e015ca82538b2b81cc51b56ef8";

// Eindeutige Session-ID — verhindert Doppelzählung durch eigene Realtime-Events
const SESSION_ID = Math.random().toString(36).slice(2);

const STAGES = [
  { key: "kontaktanfrage",    label: "Kontaktanfrage",   accent: "#4f8ef7" },
  { key: "vernetzt",          label: "Vernetzt",          accent: "#5b8dee" },
  { key: "dm1",               label: "DM 1",              accent: "#7c6ff7" },
  { key: "pitch",             label: "Pitch",             accent: "#a259f7" },
  { key: "follow_up",         label: "Follow-up",         accent: "#f7925a" },
  { key: "einwandbehandlung", label: "Einwandbehandlung", accent: "#f75a5a" },
  { key: "positive_antwort",  label: "Positive Antwort",  accent: "#4fc97e" },
  { key: "erstgespraech",     label: "Erstgespräch",      accent: "#27ae60" },
];
const STAGES_PLUS5 = ["kontaktanfrage","vernetzt","dm1","pitch"];

const MSG_STAGES = [
  { key: "dm1",               label: "DM 1",              accent: "#7c6ff7" },
  { key: "pitch",             label: "Pitch",             accent: "#a259f7" },
  { key: "follow_up",         label: "Follow-up",         accent: "#f7925a" },
  { key: "einwandbehandlung", label: "Einwandbehandlung", accent: "#f75a5a" },
  { key: "positive_antwort",  label: "Positive Antwort",  accent: "#4fc97e" },
  { key: "erstgespraech",     label: "Erstgespräch",      accent: "#27ae60" },
];

const KAMPAGNEN = [
  { key: "leadgen", label: "Leadgenerierung" },
  { key: "support", label: "Support & FAQ" },
];

// ─── SUPABASE ─────────────────────────────────────────────────────────────────
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── STATE ────────────────────────────────────────────────────────────────────
const state = {};
STAGES.forEach(s => state[s.key] = { count: 0, lastClick: null });

let msgUses = {};       // { "kampagne_stage_variante": count }
let notionCache = {};   // { kampagne: { stage: [{ variante, text, fokus }] } }

// ─── COUNTER TAB ─────────────────────────────────────────────────────────────
function renderCards() {
  document.getElementById("card-grid").innerHTML = STAGES.map((s, i) => {
    const p5 = STAGES_PLUS5.includes(s.key);
    return `
      <div class="card" id="card-${s.key}" style="--accent:${s.accent}">
        <span class="stage-num">Stage ${i+1}</span>
        <h2>${s.label}</h2>
        <div class="count" id="count-${s.key}">0</div>
        <div class="last-click" id="last-${s.key}"></div>
        <div class="btn-row">
          <button class="minus-btn" id="minus-${s.key}" onclick="handleClick('${s.key}',-1)">−1</button>
          <button class="plus-btn" onclick="handleClick('${s.key}',1)">+1</button>
          ${p5 ? `<button class="plus5-btn" onclick="handleClick('${s.key}',5)">+5</button>` : ""}
        </div>
      </div>`;
  }).join("");
}

async function loadCounterState() {
  const { data, error } = await db
    .from("counter_events")
    .select("stage, delta, created_at")
    .order("created_at", { ascending: true });
  if (error) { console.error(error); return; }
  STAGES.forEach(s => state[s.key] = { count: 0, lastClick: null });
  for (const row of data) {
    const s = state[row.stage];
    if (!s) continue;
    s.count = Math.max(0, s.count + row.delta);
    s.lastClick = row.created_at;
  }
  updateAllCounterUI();
}

function updateAllCounterUI() {
  STAGES.forEach(s => {
    document.getElementById(`count-${s.key}`).textContent = state[s.key].count;
    const minusBtn = document.getElementById(`minus-${s.key}`);
    if (minusBtn) minusBtn.disabled = state[s.key].count <= 0;
    const last = document.getElementById(`last-${s.key}`);
    if (last && state[s.key].lastClick) {
      last.textContent = "zuletzt " + new Date(state[s.key].lastClick).toLocaleTimeString("de-DE", {
        hour: "2-digit", minute: "2-digit"
      });
    }
  });
  renderSidebar();
}

async function handleClick(key, delta) {
  const s = state[key];
  const newCount = s.count + delta;
  if (newCount < 0) return;

  // Sofort lokal updaten
  s.count = newCount;
  s.lastClick = new Date().toISOString();
  updateAllCounterUI();

  const card = document.getElementById(`card-${key}`);
  if (card) { card.classList.remove("pulse"); void card.offsetWidth; card.classList.add("pulse"); }

  // session_id mitspeichern → Realtime-Listener ignoriert eigene Events
  const { error } = await db.from("counter_events").insert({ stage: key, delta, session_id: SESSION_ID });
  if (error) console.error("Counter insert error:", error);
}

function renderSidebar() {
  const dm1   = state["dm1"].count;
  const pitch = state["pitch"].count;
  const pos   = state["positive_antwort"].count;
  const erst  = state["erstgespraech"].count;
  const kont  = state["kontaktanfrage"].count;
  const vern  = state["vernetzt"].count;

  document.getElementById("stats-total").innerHTML = STAGES.map(s =>
    `<div class="stat-row">
       <span class="stat-label">${s.label}</span>
       <span class="stat-accent" style="color:${s.accent}">${state[s.key].count}</span>
     </div>`
  ).join("");

  const convs = [
    ["Anfrage → Vernetzt", kont, vern],
    ["Vernetzt → DM 1",    vern, dm1],
    ["DM 1 → Pitch",       dm1,  pitch],
    ["Pitch → Positiv",    pitch, pos],
    ["Positiv → Gespräch", pos,   erst],
  ];
  document.getElementById("stats-conv").innerHTML = convs.map(([lbl,a,b]) => {
    const pct = a > 0 ? Math.round(b/a*100) : 0;
    return `<div class="conv-row"><span>${lbl}</span><span>${pct}%</span></div>`;
  }).join("");
}

async function resetAll() {
  if (!confirm("Alle Zähler auf 0 zurücksetzen?")) return;
  await db.from("counter_events").delete().neq("id", 0);
  STAGES.forEach(s => state[s.key] = { count: 0, lastClick: null });
  updateAllCounterUI();
}

function exportJSON() {
  const out = {};
  STAGES.forEach(s => out[s.key] = state[s.key].count);
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "outreach_export.json";
  a.click();
}

// ─── NOTION HELPERS ───────────────────────────────────────────────────────────
function getText(prop) {
  if (!prop) return "";
  if (prop.type === "title"     && prop.title)     return prop.title.map(t => t.plain_text).join("");
  if (prop.type === "rich_text" && prop.rich_text) return prop.rich_text.map(t => t.plain_text).join("");
  if (prop.type === "select"    && prop.select)    return prop.select.name || "";
  return "";
}
function getCheckbox(prop) {
  if (!prop) return null;
  return prop.type === "checkbox" ? !!prop.checkbox : null;
}
function normalizeKey(v) {
  return String(v||"").trim().toLowerCase().replace(/\s+/g,"_");
}
function normalizeStage(v) {
  return String(v||"").trim().toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/\s+/g,"_");
}
function escHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ─── NOTION LOAD ──────────────────────────────────────────────────────────────
async function loadMessages() {
  const status = document.getElementById("sync-status");
  status.textContent = "🔄 Lade…";
  try {
    const res  = await fetch(`${NOTION_PROXY}?db=${NOTION_DB_ID}`);
    const json = await res.json();
    const results = json.results || [];
    notionCache = {};
    let count = 0;
    for (const page of results) {
      const p = page.properties || {};
      const kampagneRaw = getText(p.kampagne) || getText(p.Kampagne) || "leadgen";
      const stageRaw    = getText(p.stage)    || getText(p.Stage)    || "dm1";
      const varianteRaw = getText(p.variante) || getText(p.Variante) || "A";
      const textRaw     = getText(p.text)     || getText(p.Text)     || getText(p.nachricht) || getText(p.Nachricht) || "";
      const fokus       = getText(p.fokus)    || getText(p.Fokus)    || "";
      const aktivRaw    = getCheckbox(p.aktiv) ?? getCheckbox(p.Aktiv);
      const kampagne  = normalizeKey(kampagneRaw);
      const stage     = normalizeStage(stageRaw);
      const variante  = String(varianteRaw||"A").trim().toLowerCase();
      const nachricht = String(textRaw||"").trim();
      if (!nachricht)                                 continue;
      if (aktivRaw === false)                         continue;
      if (!KAMPAGNEN.some(k => k.key === kampagne))   continue;
      if (!MSG_STAGES.some(s => s.key === stage))     continue;
      if (!["a","b"].includes(variante))              continue;
      if (!notionCache[kampagne])        notionCache[kampagne] = {};
      if (!notionCache[kampagne][stage]) notionCache[kampagne][stage] = [];
      notionCache[kampagne][stage].push({ variante, text: nachricht, fokus });
      count++;
    }
    Object.keys(notionCache).forEach(k =>
      Object.keys(notionCache[k]).forEach(s =>
        notionCache[k][s].sort((a,b) => a.variante.localeCompare(b.variante))
      )
    );
    status.textContent = `✅ ${count} Nachrichten`;
  } catch(e) {
    console.error(e);
    status.textContent = "❌ Fehler";
  }
  renderMessagesFlat();
}

async function reloadMessages() {
  await loadMessages();
  await loadMsgUses();
  renderMessagesFlat();
  renderStats();
}

// ─── MESSAGES RENDER ──────────────────────────────────────────────────────────
function renderMessagesFlat() {
  const wrap = document.getElementById("messages-wrap");
  let html = "";
  for (const kamp of KAMPAGNEN) {
    let kampHtml = "";
    for (const st of MSG_STAGES) {
      const variants = notionCache[kamp.key]?.[st.key] || [];
      if (!variants.length) continue;
      kampHtml += `<div class="stage-block">
        <div class="stage-title" style="--stage-accent:${st.accent}">
          <span class="stage-title-dot"></span>${st.label}
        </div>
        <div class="ab-grid">`;
      for (const v of variants) {
        const vClass  = v.variante === "b" ? "variant-b" : "variant-a";
        const useKey  = `${kamp.key}_${st.key}_${v.variante}`;
        const uses    = msgUses[useKey] || 0;
        const uid     = Math.random().toString(36).slice(2,7);
        const btnId   = `copy-${uid}`;
        kampHtml += `
          <div class="msg-card ${vClass}">
            <div class="msg-header">
              <span class="variant-badge">Variante ${v.variante.toUpperCase()}</span>
              <span class="use-count" id="uses-${useKey}">${uses}× verwendet</span>
            </div>
            ${v.fokus ? `<div class="fokus-tag">${escHtml(v.fokus)}</div>` : ""}
            <div class="msg-text">${escHtml(v.text)}</div>
            <div class="msg-actions">
              <button class="copy-btn" id="${btnId}"
                onclick="copyMsg('${btnId}','${kamp.key}','${st.key}','${v.variante}',this)">
                📋 Kopieren
              </button>
            </div>
            <div class="msg-track-row">
              <button class="msg-track-btn minus"
                onclick="trackMsgAction('${kamp.key}','${st.key}','${v.variante}',-1)">−1</button>
              <button class="msg-track-btn plus1"
                onclick="trackMsgAction('${kamp.key}','${st.key}','${v.variante}',1)">+1</button>
              <button class="msg-track-btn plus5"
                onclick="trackMsgAction('${kamp.key}','${st.key}','${v.variante}',5)">+5</button>
              <span class="msg-track-hint">Counter + A/B</span>
            </div>
          </div>`;
      }
      kampHtml += `</div></div>`;
    }
    if (kampHtml) html += `<div class="kampagne-block"><div class="kampagne-title">${kamp.label}</div>${kampHtml}</div>`;
  }
  if (!html) html = `<div style="color:#5a607a;text-align:center;padding:3rem">
    Keine Nachrichten geladen.<br>
    Prüfe Notion-Properties: <b>kampagne</b>, <b>stage</b>, <b>variante</b>, <b>text</b>, <b>aktiv</b>.
  </div>`;
  wrap.innerHTML = html;
}

// ─── COPY ─────────────────────────────────────────────────────────────────────
async function copyMsg(btnId, kampagne, stage, variante, btn) {
  const v = notionCache[kampagne]?.[stage]?.find(x => x.variante === variante);
  if (!v) return;
  try {
    await navigator.clipboard.writeText(v.text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = v.text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
  }
  btn.textContent = "✅ Kopiert!";
  btn.classList.add("copied");
  setTimeout(() => { btn.textContent = "📋 Kopieren"; btn.classList.remove("copied"); }, 1800);

  // Nur message_uses tracken — kein Counter-Increment beim Kopieren
  await insertMsgUse(kampagne, stage, variante);
}

// ─── TRACK MSG ACTION (Counter + A/B) ─────────────────────────────────────────
async function trackMsgAction(kampagne, stage, variante, delta) {
  // 1. Counter lokal updaten
  const s = state[stage];
  if (!s) return;
  const newCount = s.count + delta;
  if (newCount < 0) return;
  s.count = newCount;
  s.lastClick = new Date().toISOString();
  updateAllCounterUI();

  const card = document.getElementById(`card-${stage}`);
  if (card) { card.classList.remove("pulse"); void card.offsetWidth; card.classList.add("pulse"); }

  // 2. Counter in DB mit session_id
  const { error: ce } = await db.from("counter_events").insert({ stage, delta, session_id: SESSION_ID });
  if (ce) console.error("Counter insert error:", ce);

  // 3. message_uses nur für delta > 0 tracken (Nutzung, kein Abzug)
  if (delta > 0) {
    for (let i = 0; i < delta; i++) {
      await insertMsgUse(kampagne, stage, variante);
    }
  }
}

// ─── MSG USE INSERT & LOCAL UPDATE ───────────────────────────────────────────
async function insertMsgUse(kampagne, stage, variante) {
  const { error } = await db.from("message_uses").insert({ kampagne, stage, variante, session_id: SESSION_ID });
  if (error) { console.error("message_uses insert error:", error); return; }

  // Lokal inkrementieren — Realtime ignoriert eigene session
  const useKey = `${kampagne}_${stage}_${variante}`;
  msgUses[useKey] = (msgUses[useKey] || 0) + 1;
  const el = document.getElementById(`uses-${useKey}`);
  if (el) el.textContent = msgUses[useKey] + "× verwendet";
  if (document.getElementById("tab-stats").classList.contains("active")) renderStats();
}

// ─── MSG USES LOAD ────────────────────────────────────────────────────────────
async function loadMsgUses() {
  const { data, error } = await db.from("message_uses").select("kampagne,stage,variante");
  if (error) { console.error(error); return; }
  msgUses = {};
  for (const row of data) {
    const key = `${row.kampagne}_${row.stage}_${row.variante}`;
    msgUses[key] = (msgUses[key] || 0) + 1;
  }
}

// ─── A/B STATS ────────────────────────────────────────────────────────────────
function renderStats() {
  const wrap = document.getElementById("stats-wrap");
  let html = "";
  for (const kamp of KAMPAGNEN) {
    html += `<div><div class="stats-kampagne-title">${kamp.label}</div><div class="stats-grid">`;
    for (const st of MSG_STAGES) {
      const a = msgUses[`${kamp.key}_${st.key}_a`] || 0;
      const b = msgUses[`${kamp.key}_${st.key}_b`] || 0;
      const total = a + b;
      const barA = total > 0 ? Math.round(a/total*100) : 0;
      const barB = total > 0 ? Math.round(b/total*100) : 0;
      html += `
        <div class="stats-card">
          <h3 style="color:${st.accent}">${st.label}</h3>
          ${total === 0
            ? `<div class="ab-empty">Noch keine Nutzung erfasst</div>`
            : `<div class="ab-stat-row">
                <span class="ab-stat-label">Verteilung</span>
                <div class="ab-bar-wrap">
                  <div class="ab-bar bar-a" style="width:${barA}%"></div>
                  <div class="ab-bar bar-b" style="width:${barB}%"></div>
                </div>
                <div class="ab-counts">
                  <span class="ab-count-a">A: ${a}</span>
                  <span class="ab-count-b">B: ${b}</span>
                </div>
              </div>
              <div class="ab-stat-row">
                <span class="ab-stat-label">Gesamt</span>
                <span style="font-size:0.82rem;color:#9aa0b4;font-weight:700">${total}</span>
              </div>`}
        </div>`;
    }
    html += `</div></div>`;
  }
  wrap.innerHTML = html;
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(`tab-${name}`).classList.add("active");
  btn.classList.add("active");
  if (name === "stats") renderStats();
}

// ─── REALTIME ── nur Events von ANDEREN Sessions verarbeiten ─────────────────
function setupRealtime() {
  db.channel("outreach")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "counter_events" }, payload => {
      // Eigene Events bereits lokal verarbeitet — ignorieren
      if (payload.new.session_id === SESSION_ID) return;
      const { stage, delta } = payload.new;
      if (!state[stage]) return;
      state[stage].count = Math.max(0, state[stage].count + delta);
      state[stage].lastClick = payload.new.created_at;
      updateAllCounterUI();
    })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "message_uses" }, payload => {
      // Eigene Events bereits lokal verarbeitet — ignorieren
      if (payload.new.session_id === SESSION_ID) return;
      const { kampagne, stage, variante } = payload.new;
      const key = `${kampagne}_${stage}_${variante}`;
      msgUses[key] = (msgUses[key] || 0) + 1;
      const el = document.getElementById(`uses-${key}`);
      if (el) el.textContent = msgUses[key] + "× verwendet";
      if (document.getElementById("tab-stats").classList.contains("active")) renderStats();
    })
    .subscribe();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
(async () => {
  renderCards();
  await loadCounterState();
  await loadMsgUses();
  await loadMessages();
  renderStats();
  setupRealtime();
  document.getElementById("sync-status").textContent = "✅ Bereit";
})();
</script>
