<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Outreach Counter</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    header h1 { font-size: 1.4rem; color: #e8eaf0; display: flex; align-items: center; gap: 0.4rem; }

    .header-actions { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }

    #sync-status {
      font-size: 0.75rem; color: #9aa0b4;
      background: #1c1f2e; border-radius: 20px;
      padding: 0.3rem 0.75rem; box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    .export-btn {
      font-size: 0.75rem; color: #9aa0b4;
      background: #1c1f2e; border: 1px solid #2a2f45;
      border-radius: 20px; padding: 0.3rem 0.75rem;
      cursor: pointer; transition: color 0.15s, border-color 0.15s;
    }
    .export-btn:hover { color: #4f8ef7; border-color: #4f8ef7; }

    .subtitle {
      max-width: 1200px; margin: 0 auto 1.5rem;
      font-size: 0.8rem; color: #5a607a; text-align: center;
    }

    .main-layout {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .main-layout { grid-template-columns: 1fr; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .card {
      background: #1c1f2e;
      border-radius: 14px;
      padding: 1.1rem 0.9rem 1rem;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
      display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
      position: relative;
      transition: box-shadow 0.2s;
      border: 1px solid #252840;
    }

    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

    .card::before {
      content: ""; position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      border-radius: 14px 14px 0 0;
      background: var(--accent, #4f8ef7);
    }

    .stage-num { font-size: 0.62rem; font-weight: 700; color: #444a66; letter-spacing: 0.08em; text-transform: uppercase; }

    .card h2 { font-size: 0.78rem; color: #9aa0b4; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.3; }

    .count { font-size: 2.6rem; font-weight: 800; color: #e8eaf0; line-height: 1; margin: 0.2rem 0; }

    .last-click { font-size: 0.65rem; color: #444a66; min-height: 0.9em; }

    .btn-row { display: flex; gap: 0.4rem; width: 100%; margin-top: 0.2rem; }

    button.minus-btn {
      background: #252840; color: #9aa0b4;
      border: none; border-radius: 8px;
      padding: 0.45rem 0.7rem; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
      flex-shrink: 0;
    }
    button.minus-btn:hover { background: #c0392b22; color: #e05555; }
    button.minus-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    button.plus-btn {
      background: var(--accent, #4f8ef7); color: #fff;
      border: none; border-radius: 8px;
      padding: 0.45rem 0; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: filter 0.15s, transform 0.1s;
      flex: 1;
    }
    button.plus-btn:hover { filter: brightness(1.2); }
    button.plus-btn:active { transform: scale(0.96); }
    button.plus-btn:disabled { background: #252840; color: #444a66; cursor: not-allowed; }

    button.plus5-btn {
      background: transparent;
      color: var(--accent, #4f8ef7);
      border: 2px solid var(--accent, #4f8ef7);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    button.plus5-btn:hover { background: var(--accent, #4f8ef7); color: #fff; }
    button.plus5-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .sidebar {
      background: #1c1f2e;
      border-radius: 14px;
      padding: 1.25rem;
      border: 1px solid #252840;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
      position: sticky;
      top: 1.5rem;
    }

    .sidebar h3 { font-size: 0.8rem; color: #5a607a; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }

    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid #252840;
      font-size: 0.82rem;
    }
    .stat-row:last-of-type { border-bottom: none; }
    .stat-label { color: #9aa0b4; }
    .stat-value { color: #e8eaf0; font-weight: 700; }
    .stat-accent { color: var(--c, #4f8ef7); }

    .conversion-block { margin-top: 1rem; }
    .conversion-block h3 { margin-bottom: 0.75rem; }

    .conv-row {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; padding: 0.35rem 0;
      border-bottom: 1px solid #1a1d2e;
      color: #9aa0b4;
    }
    .conv-row span:last-child { color: #4fc97e; font-weight: 700; }

    .footer-actions {
      max-width: 1200px; margin: 1.5rem auto 0;
      display: flex; justify-content: center;
    }

    .reset-btn {
      background: transparent; color: #5a607a;
      border: 1px solid #2a2f45; border-radius: 8px;
      padding: 0.45rem 1.2rem; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: color 0.15s, border-color 0.15s;
    }
    .reset-btn:hover { color: #e05555; border-color: #e05555; }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(79,142,247,0.4); }
      70%  { box-shadow: 0 0 0 10px rgba(79,142,247,0); }
      100% { box-shadow: 0 0 0 0 rgba(79,142,247,0); }
    }
    .card.pulse { animation: pulse-ring 0.5s ease-out; }
  </style>
</head>
<body>

<header>
  <h1>📊 LinkedIn Outreach</h1>
  <div class="header-actions">
    <button class="export-btn" onclick="exportJSON()">⬇ JSON Export</button>
    <div id="sync-status">⏳ Verbinde…</div>
  </div>
</header>
<p class="subtitle">Klicke +1 sobald du die Aktion ausgeführt hast. Sync läuft automatisch auf allen Geräten.</p>

<div class="main-layout">
  <div class="grid" id="card-grid"></div>

  <div class="sidebar">
    <h3>📈 Auswertung</h3>
    <div id="stats-total"></div>
    <div class="conversion-block">
      <h3>🔄 Conversions</h3>
      <div id="stats-conv"></div>
    </div>
  </div>
</div>

<div class="footer-actions">
  <button class="reset-btn" onclick="resetAll()">🔄 Alle Zähler zurücksetzen</button>
</div>

<script>
  // ── Konfiguration ──────────────────────────────────────────────
  const SUPABASE_URL = "https://xxxxx.supabase.co";  // ← deine Project URL
  const SUPABASE_KEY = "eyJhbGciOi...";              // ← dein anon public key
  const TABLE        = "counter_events";

  const STAGES = [
    { key: "kontaktanfrage",    label: "Kontakt­anfrage",    accent: "#4f8ef7" },
    { key: "vernetzt",          label: "Vernetzt",           accent: "#5b8dee" },
    { key: "dm1",               label: "DM 1",               accent: "#7c6ff7" },
    { key: "pitch",             label: "Pitch",              accent: "#a259f7" },
    { key: "follow_up",         label: "Follow-up",          accent: "#f7925a" },
    { key: "einwandbehandlung", label: "Einwand­behandlung", accent: "#f75a5a" },
    { key: "positive_antwort",  label: "Positive Antwort",   accent: "#4fc97e" },
    { key: "erstgespraech",     label: "Erst­gespräch",      accent: "#27ae60" },
  ];

  const STAGES_WITH_PLUS5 = ["kontaktanfrage", "vernetzt", "dm1", "pitch"];

  // ── Supabase ────────────────────────────────────────────────────
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ── State ───────────────────────────────────────────────────────
  const state = {};
  STAGES.forEach(s => state[s.key] = { count: 0, lastClick: null });

  // ── UI: Cards ───────────────────────────────────────────────────
  function renderCards() {
    document.getElementById("card-grid").innerHTML = STAGES.map((s, i) => {
      const hasPlus5 = STAGES_WITH_PLUS5.includes(s.key);
      return `
        <div class="card" id="card-${s.key}" style="--accent: ${s.accent}">
          <span class="stage-num">Stage ${i + 1}</span>
          <h2>${s.label}</h2>
          <div class="count" id="count-${s.key}">0</div>
          <div class="last-click" id="last-${s.key}"></div>
          <div class="btn-row">
            <button class="minus-btn" id="minus-${s.key}" onclick="handleClick('${s.key}', -1)">−1</button>
            <button class="plus-btn"  id="btn-${s.key}"   onclick="handleClick('${s.key}',  1)">+1</button>
            ${hasPlus5 ? `<button class="plus5-btn" id="btn5-${s.key}" onclick="handleClick('${s.key}', 5)">+5</button>` : ""}
          </div>
        </div>
      `;
    }).join("");
  }

  function updateUI(key) {
    const countEl = document.getElementById(`count-${key}`);
    const lastEl  = document.getElementById(`last-${key}`);
    if (!countEl) return;
    countEl.textContent = state[key].count;
    lastEl.textContent  = state[key].lastClick
      ? `${new Date(state[key].lastClick).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} Uhr`
      : "";
    updateSidebar();
  }

  function pulseCard(key) {
    const card = document.getElementById(`card-${key}`);
    if (!card) return;
    card.classList.remove("pulse");
    void card.offsetWidth;
    card.classList.add("pulse");
  }

  function setStatus(msg) { document.getElementById("sync-status").textContent = msg; }

  // ── UI: Sidebar Auswertung ──────────────────────────────────────
  function conv(a, b) {
    if (!a || !b) return "–";
    return (b / a * 100).toFixed(1) + "%";
  }

  function updateSidebar() {
    const c = key => state[key]?.count || 0;

    document.getElementById("stats-total").innerHTML = STAGES.map(s => `
      <div class="stat-row">
        <span class="stat-label">${s.label}</span>
        <span class="stat-value stat-accent" style="--c: ${s.accent}">${c(s.key)}</span>
      </div>
    `).join("");

    const convData = [
      ["Anfrage → Vernetzt",          c("kontaktanfrage"),   c("vernetzt")],
      ["Vernetzt → DM 1",             c("vernetzt"),         c("dm1")],
      ["DM 1 → Pitch",                c("dm1"),              c("pitch")],
      ["Pitch → Pos. Antwort",        c("pitch"),            c("positive_antwort")],
      ["Pos. Antwort → Gespräch",     c("positive_antwort"), c("erstgespraech")],
      ["Gesamt (Anfrage → Gespräch)", c("kontaktanfrage"),   c("erstgespraech")],
    ];

    document.getElementById("stats-conv").innerHTML = convData.map(([label, a, b]) => `
      <div class="conv-row">
        <span>${label}</span>
        <span>${conv(a, b)}</span>
      </div>
    `).join("");
  }

  // ── Records laden ───────────────────────────────────────────────
  async function loadCounts() {
    setStatus("⏳ Lade Daten…");
    const { data, error } = await db.from(TABLE).select("*").order("created_at");
    if (error) { console.error(error); setStatus("🔴 Verbindungsfehler"); return; }

    STAGES.forEach(s => state[s.key] = { count: 0, lastClick: null });
    data.forEach(r => {
      if (state[r.stage] !== undefined) {
        state[r.stage].count     += (r.delta || 1);
        state[r.stage].lastClick  = r.created_at;
      }
    });
    STAGES.forEach(s => updateUI(s.key));
    setStatus("🟢 Synchronisiert");
  }

  // ── Klick → Supabase Insert ─────────────────────────────────────
  async function handleClick(stageKey, delta) {
    if (delta < 0 && state[stageKey].count <= 0) return;

    const plusBtn  = document.getElementById(`btn-${stageKey}`);
    const minusBtn = document.getElementById(`minus-${stageKey}`);
    const plus5Btn = document.getElementById(`btn5-${stageKey}`);
    if (plusBtn)  plusBtn.disabled  = true;
    if (minusBtn) minusBtn.disabled = true;
    if (plus5Btn) plus5Btn.disabled = true;

    const { error } = await db.from(TABLE).insert({
      stage:  stageKey,
      delta:  delta,
      source: /iPhone|iPad|iPod/.test(navigator.userAgent) ? "ios" : "mac",
    });

    if (error) {
      console.error(error);
      setStatus("🔴 Speichern fehlgeschlagen");
      if (plusBtn)  plusBtn.disabled  = false;
      if (minusBtn) minusBtn.disabled = false;
      if (plus5Btn) plus5Btn.disabled = false;
    }
  }

  // ── Realtime-Sync ────────────────────────────────────────────────
  function subscribeRealtime() {
    db.channel("counter_realtime")
      .on("postgres_changes",
        { event: "INSERT", schema: "public", table: TABLE },
        (payload) => {
          const r = payload.new;
          if (state[r.stage] !== undefined) {
            state[r.stage].count     += (r.delta || 1);
            state[r.stage].lastClick  = r.created_at;
            if (state[r.stage].count < 0) state[r.stage].count = 0;
            updateUI(r.stage);
            if (r.delta > 0) pulseCard(r.stage);
            setStatus("🟢 Synchronisiert");
            const plusBtn  = document.getElementById(`btn-${r.stage}`);
            const minusBtn = document.getElementById(`minus-${r.stage}`);
            const plus5Btn = document.getElementById(`btn5-${r.stage}`);
            if (plusBtn)  plusBtn.disabled  = false;
            if (minusBtn) minusBtn.disabled = false;
            if (plus5Btn) plus5Btn.disabled = false;
          }
        }
      )
      .on("postgres_changes",
        { event: "DELETE", schema: "public", table: TABLE },
        () => loadCounts()
      )
      .subscribe((status) => {
        if (status === "SUBSCRIBED") setStatus("🟢 Synchronisiert");
        if (status === "CHANNEL_ERROR") setStatus("🔴 Realtime-Fehler");
      });
  }

  // ── JSON Export ──────────────────────────────────────────────────
  function exportJSON() {
    const c = key => state[key]?.count || 0;
    const data = {
      exportedAt: new Date().toISOString(),
      counts: {},
      conversions: {
        "anfrage_zu_vernetzt":      conv(c("kontaktanfrage"),   c("vernetzt")),
        "vernetzt_zu_dm1":          conv(c("vernetzt"),         c("dm1")),
        "dm1_zu_pitch":             conv(c("dm1"),              c("pitch")),
        "pitch_zu_positiv":         conv(c("pitch"),            c("positive_antwort")),
        "positiv_zu_erstgespraech": conv(c("positive_antwort"), c("erstgespraech")),
        "gesamt":                   conv(c("kontaktanfrage"),   c("erstgespraech")),
      }
    };
    STAGES.forEach(s => { data.counts[s.key] = c(s.key); });

    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = `outreach-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── Reset ────────────────────────────────────────────────────────
  async function resetAll() {
    if (!confirm("Alle Zähler wirklich auf 0 zurücksetzen?\nDas löscht alle gespeicherten Events permanent.")) return;
    setStatus("⏳ Lösche…");
    const { error } = await db.from(TABLE).delete().neq("id", 0);
    if (error) { console.error(error); setStatus("🔴 Reset fehlgeschlagen"); return; }
    setStatus("🟢 Zurückgesetzt");
  }

  // ── Start ────────────────────────────────────────────────────────
  (async () => {
    renderCards();
    await loadCounts();
    subscribeRealtime();
  })();
</script>
</body>
</html>
